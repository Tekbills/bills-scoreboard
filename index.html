<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bills | NFL Sunday Scoreboard</title>
<style>
:root{--blue:#0754bb;--red:#ed173a;--ink:#05070d;--line:#465063}
*{box-sizing:border-box}html,body{margin:0;background:var(--ink);color:#f5f7ff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
header{height:19vh;min-height:118px;background:linear-gradient(115deg,#02050b 5%,#0a1c40 62%,#080b12 100%);border-bottom:3px solid #145fe1;display:flex;align-items:center;justify-content:space-between;padding:12px 3%;position:relative;overflow:hidden}
header:after{content:"";position:absolute;bottom:0;left:0;width:100%;height:4px;background:linear-gradient(90deg,#ed173a,#125fe8,#ed173a)}
.heading{font-weight:1000;font-style:italic;letter-spacing:-1px;line-height:.95;font-size:clamp(25px,3.8vw,70px);text-shadow:2px 3px #111}
.heading span{display:block;color:#f12745}.brand{display:flex;align-items:center;gap:20px;font-size:clamp(22px,3vw,54px);font-weight:900;font-style:italic}
.brand img{width:clamp(85px,12vw,210px);filter:drop-shadow(0 0 8px #2779ff)}
.toolbar{height:38px;display:flex;align-items:center;gap:16px;padding:0 2%;background:#0b1220;font-size:13px}
.toolbar button{background:#16294b;border:1px solid #4969a0;color:white;border-radius:5px;padding:5px 10px;cursor:pointer}
.toolbar .status{margin-left:auto;color:#a9bad6}
.viewport{height:calc(81vh - 80px);overflow:hidden;position:relative;padding:12px 2.5%}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-content:start}
.game{min-height:140px;border:1px solid #586277;border-radius:5px;background:linear-gradient(145deg,#111721,#05080d);box-shadow:inset 0 0 0 1px #161d29;display:grid;grid-template-columns:minmax(0,1fr) 80px;padding:12px 14px;gap:8px}
.game.bills{border:3px solid #ff244e;box-shadow:0 0 14px #e6194d80}
.teams{display:grid;grid-template-rows:1fr 1fr;gap:5px}.team{display:flex;align-items:center;gap:10px;min-width:0}
.team img{height:42px;width:55px;object-fit:contain}.abbr{font-size:clamp(19px,2.3vw,39px);font-weight:900;flex:1}.score{font-size:clamp(31px,3.7vw,62px);font-weight:1000;font-variant-numeric:tabular-nums;letter-spacing:-2px}
.gameinfo{border-left:1px solid #697183;text-align:center;display:flex;flex-direction:column;justify-content:center;font-size:clamp(14px,1.35vw,24px);font-weight:700;gap:7px}
.gameinfo small{font-size:12px;color:#abbad2}.gameinfo .clock{font-size:clamp(17px,2vw,30px)}
footer{height:42px;display:flex;align-items:center;background:#080d18;border-top:2px solid #0d56c7;gap:14px;padding:0 2%;font-weight:800;overflow:hidden;white-space:nowrap}
footer strong{color:#f02848}#ticker{color:#d8e3f7;font-size:14px;overflow:hidden;text-overflow:ellipsis}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:20;background:radial-gradient(circle,#1748a5 0%,#050b22 50%,#000 100%);overflow:hidden}
.overlay.active{display:flex;animation:flashBg .55s infinite alternate}
.overlay:before,.overlay:after{content:"";position:absolute;inset:-70%;background:conic-gradient(from 0deg,transparent 0deg,#ed163b88 18deg,transparent 35deg,#145fff88 80deg,transparent 100deg);animation:spin 3s linear infinite}
.overlay:after{animation-direction:reverse;animation-duration:4s;opacity:.65}
.overlay img{position:relative;z-index:2;width:min(70vw,700px);max-height:52vh;object-fit:contain;filter:drop-shadow(0 0 35px #fff) drop-shadow(0 0 60px #145aff);animation:buffaloPulse .42s infinite alternate}
.overlay h1{z-index:2;position:relative;margin:0;font-size:clamp(38px,8vw,145px);font-style:italic;text-align:center;text-shadow:0 0 20px #ed1741,4px 5px #041b57;line-height:1.05}
.overlay p{z-index:2;font-size:clamp(18px,2.4vw,35px);letter-spacing:8px;font-weight:900}
@keyframes flashBg{from{box-shadow:inset 0 0 180px #ed173a}to{box-shadow:inset 0 0 200px #075fff}}
@keyframes buffaloPulse{from{transform:scale(.94);opacity:.8}to{transform:scale(1.08);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:850px){header{min-height:100px}.brand{gap:4px}.game{min-height:118px;grid-template-columns:minmax(0,1fr) 55px;padding:8px}.team img{width:33px;height:34px}.team{gap:3px}.grid{gap:8px}.gameinfo{font-size:12px}.gameinfo .clock{font-size:15px}}
</style></head>
<body><header><div class="heading">NFL SUNDAY<span>SCOREBOARD</span></div><div class="brand"><img src="https://a.espncdn.com/i/teamlogos/nfl/500/buf.png" alt="Buffalo Bills">BUFFALO<br>BILLS</div></header>
<div class="toolbar"><button id="today">TODAY</button><button id="full">TV FULLSCREEN</button><button id="test">TEST BILLS TD 🎉</button><span class="status" id="status">Loading NFL games…</span></div>
<div class="viewport" id="viewport"><div class="grid" id="grid"></div></div>
<footer><strong>NFL SUNDAY</strong><span id="ticker">Live NFL scoreboard • Updated every 30 seconds</span></footer>
<div class="overlay" id="overlay"><img src="https://a.espncdn.com/i/teamlogos/nfl/500/buf.png" alt="Buffalo Bills"><h1>TOUCHDOWN<br>BUFFALO!</h1><p>LET'S GO BILLS!</p></div>
<script>
const API='https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard';
const $=id=>document.getElementById(id);
let selectedDate=null, games=[], lastPlayIds=new Set(), initialized=false, celebrating=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=d=>`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
function sundayDate(){const d=new Date();d.setDate(d.getDate()+((7-d.getDay())%7));return d}
function logo(team){return team?.logo||`https://a.espncdn.com/i/teamlogos/nfl/500/${team?.abbreviation?.toLowerCase()||'nfl'}.png`}
function displayGame(event){
 const c=event.competitions?.[0];if(!c)return '';
 const cs=c.competitors||[];const home=cs.find(x=>x.homeAway==='home')||cs[0],away=cs.find(x=>x.homeAway==='away')||cs[1];if(!home||!away)return '';
 const bills=cs.some(x=>x.team?.abbreviation==='BUF');
 const state=event.status?.type?.state||'pre';
 const score=x=>state==='pre'?'—':esc(x.score??'0');
 const team=x=>`<div class="team"><img loading="lazy" src="${esc(logo(x.team))}" alt=""><span class="abbr">${esc(x.team?.abbreviation||'')}</span><span class="score">${score(x)}</span></div>`;
 const info=state==='pre'?`<div>${new Date(event.date).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/New_York'})}</div><small>ET</small>`:
 state==='post'?'<div>FINAL</div>':`<div>${esc(event.status?.period||'')}${ordinal(event.status?.period)} QTR</div><div class="clock">${esc(event.status?.displayClock||'')}</div>`;
 return `<article class="game ${bills?'bills':''}"><div class="teams">${team(away)}${team(home)}</div><div class="gameinfo">${info}</div></article>`;
}
function ordinal(n){return n===1?'st':n===2?'nd':n===3?'rd':'th'}
function render(){const sorted=[...games].sort((a,b)=>new Date(a.date)-new Date(b.date));$('grid').innerHTML=sorted.map(displayGame).join('')||'<div>No NFL games scheduled for this date.</div>';$('ticker').textContent=sorted.map(e=>{const c=e.competitions?.[0],t=c?.competitors||[];return t.length===2?`${t[0].team.abbreviation} ${t[0].score||'—'}  •  ${t[1].team.abbreviation} ${t[1].score||'—'}`:''}).join('    |    ')}
function billEvents(){return games.filter(e=>e.competitions?.[0]?.competitors?.some(c=>c.team?.abbreviation==='BUF'))}
async function checkBillsPlays(){
 for(const e of billEvents()){
  if(e.status?.type?.state!=='in')continue;
  try{
   const r=await fetch(`https://site.api.espn.com/apis/site/v2/sports/football/nfl/summary?event=${encodeURIComponent(e.id)}`,{cache:'no-store'});
   if(!r.ok)continue;const data=await r.json();
   const plays=data.scoringPlays||[];
   for(const p of plays){
    const id=String(p.id||p.play?.id||`${e.id}-${p.clock?.displayValue}-${p.text}`);
    const isTD=/touchdown/i.test(p.text||p.play?.text||'');
    const isBills=p.team?.abbreviation==='BUF'||p.team?.id==='2';
    if(initialized&&!lastPlayIds.has(id)&&isTD&&isBills)celebrate();
    lastPlayIds.add(id);
   }
  }catch(err){console.warn('Play data unavailable',err)}
 }
 initialized=true;
}
async function refresh(){
 try{
  const d=selectedDate||fmtDate(sundayDate());
  const r=await fetch(`${API}?dates=${d}&limit=100`,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);
  const data=await r.json();games=data.events||[];render();$('status').textContent=`${games.length} games • Updated ${new Date().toLocaleTimeString('en-US')}`;
  await checkBillsPlays();
 }catch(e){$('status').textContent='Live data unavailable — retrying';console.warn(e)}
}
let animationTimer;
function celebrate(){if(celebrating)return;celebrating=true;$('overlay').classList.add('active');clearTimeout(animationTimer);animationTimer=setTimeout(()=>{$('overlay').classList.remove('active');celebrating=false},11000)}
$('test').onclick=celebrate;$('today').onclick=()=>{selectedDate=fmtDate(new Date());initialized=false;lastPlayIds.clear();refresh()};
$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.()};
let scrollDir=1,last=performance.now();const view=$('viewport');
function animate(t){const dt=Math.min(t-last,50);last=t;if(!celebrating&&view.scrollHeight>view.clientHeight+4){view.scrollTop+=scrollDir*dt*.017;if(view.scrollTop>=view.scrollHeight-view.clientHeight-2)scrollDir=-1;if(view.scrollTop<=1)scrollDir=1}requestAnimationFrame(animate)}
requestAnimationFrame(animate);refresh();setInterval(refresh,30000);
</script></body></html>
